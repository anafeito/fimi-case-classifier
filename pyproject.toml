[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fimi-case-classifier"
version = "0.1.0"
description = "Classify EUvsDisinfo FIMI cases by narrative and target country, suggest DISARM techniques, export STIX 2.1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "stix2>=3.0,<4"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<1.47", "plotly>=5.20"]
dev = ["pytest>=8.0"]

[project.scripts]
fimi-classify = "fimi_classifier.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
